    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100dvh;
            overflow-x: hidden;
            background: #050b0e;
        }

        .love-note {
            position: fixed;
            bottom: calc(24% + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            color: #8ef6e4;
            font-family: 'Dancing Script', 'Segoe Script', cursive;
            font-size: clamp(28px, 8vw, 44px);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(110, 243, 214, 0.65), 0 0 22px rgba(45, 212, 191, 0.35);
            pointer-events: none;
            white-space: nowrap;
        }

            .love-note .heart {
                color: #ff6b8b;
                display: inline-block;
                margin: 0 8px;
                font-size: clamp(24px, 6.5vw, 34px);
                text-shadow: 0 0 12px rgba(255, 107, 139, 0.8), 0 0 24px rgba(255, 224, 102, 0.35);
                animation: heartbeat 1.5s infinite ease-in-out;
            }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.22);
            }
        }
    </style>
